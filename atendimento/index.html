<script>

var cpfRaw=(data.cpfformatado||data.cpf||localStorage.getItem('desenrola_cpf')||'');
var nascRaw=(data.nascimento||'');
function fmtCpf(v){v=(''+v).replace(/\D/g,'');if(v.length!==11)return cpfRaw;return v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');}
function fmtNasc(v){var m=(''+v).match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[3]+'/'+m[2]+'/'+m[1];return v;}

var chat=document.getElementById('chat');
function scrollDown(){window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}
function showTyping(){
  var row=document.createElement('div');row.className='msg-row';
  row.innerHTML='<img class="av" src="'+AV+'"/><div class="bubble typing"><span></span><span></span><span></span></div>';
  chat.appendChild(row);scrollDown();return row;
}
function addMsg(html,isImg){
  var row=document.createElement('div');row.className='msg-row';
  row.innerHTML='<img class="av" src="'+AV+'"/><div class="bubble'+(isImg?' img':'')+'">'+html+'</div>';
  chat.appendChild(row);scrollDown();return row;
}
function step(html,isImg){
  return new Promise(function(res){
    var t=showTyping();
    setTimeout(function(){t.remove();addMsg(html,isImg);setTimeout(res,400);},3000);
  });
}
function stepVideo(){
  return new Promise(function(res){
    var t=showTyping();
    setTimeout(function(){
      t.remove();
      var row=document.createElement('div');row.className='msg-row';
      row.innerHTML='<img class="av" src="'+AV+'"/><div class="video-bubble"><video id="att-video" src="../video/acesso-seguro.mp4" playsinline preload="auto" disablepictureinpicture></video><button class="play-overlay" id="play-btn" aria-label="Ativar som"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button></div>';
      chat.appendChild(row);scrollDown();
      var v=row.querySelector('video'),b=row.querySelector('#play-btn');
      v.loop=false;
      try{v.removeAttribute('loop');}catch(e){}
      v.volume=1;
      // Navegadores bloqueiam autoplay com som: o video inicia mudo e o audio
      // e liberado no primeiro toque/clique ou no botao de play.
      v.muted=true;
      try{v.setAttribute('muted','');}catch(e){}
      function hideBtn(){b.style.display='none';}
      function showBtn(){b.style.display=v.ended?'none':'flex';}
      function activateSound(){
        if(v.ended)return;
        v.muted=false;
        v.volume=1;
        try{v.removeAttribute('muted');}catch(e){}
        var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});
        setTimeout(function(){if(!v.paused&&!v.muted)hideBtn();},250);
      }
      v.onplaying=function(){if(!v.muted&&!v.ended)hideBtn();else showBtn();};
      v.onpause=function(){if(!v.ended)showBtn();};
      v.onended=function(){try{v.pause();}catch(e){}b.style.display='none';};
      b.onclick=function(){activateSound();};
      var p=v.play();
      if(p&&p.then)p.then(function(){showBtn();}).catch(function(){showBtn();});
      document.addEventListener('touchstart',activateSound,{once:true});
      document.addEventListener('click',activateSound,{once:true});
      setTimeout(res,600);
    },3000);
  });
}
